[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-resolution"
version = "0.1.0"
description = "Amazon ML Challenge 2026 - Business Entity Resolution pipeline"
requires-python = ">=3.11"
# Loose floors here; exact versions are pinned in requirements.txt for reproducibility.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "sparse_dot_topn>=1.1",   # Apache-2.0; memory-bounded sparse top-k matmul
    "psutil>=5.9",
    "anyascii>=0.3",          # ISC; Indic -> ASCII for the name_key blocking channel
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
